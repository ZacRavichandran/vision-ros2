

# detector_node parameters
detector_node:
  ros__parameters:
    weights:               /home/dcist/data/weights/sam3.pt
    confidence:            0.5
    tracker_n_dets:        5
    track_distance_thresh: 5.0
    scale_depth:           true
    detection_depth_scale: 1000.0  # realsense depth is in mm
    odom_sub_topic:         prometheus/odom
    cameras:
      front_right:
        color_sub_topic:    /prometheus/frontright/rotated/color/image_raw
        depth_sub_topic:    /prometheus/frontright/rotated/depth/image_rect
        depth_info_sub_topic:  /prometheus/frontright/rotated/color/camera_info
        camera_frame:          prometheus/frontright
        camera_to_body_rotation: [ 0.67956665, -0.47025164, 0.20790072, -0.52328754]
      front_left:
        color_sub_topic:         /prometheus/frontleft/rotated/color/image_raw
        depth_sub_topic:        /prometheus/frontleft/rotated/depth/image_rect
        depth_info_sub_topic:   /prometheus/frontleft/rotated/color/camera_info
        camera_frame:          prometheus/frontleft
        camera_to_body_rotation:  [-0.47292251, 0.67509865, -0.52806146, 0.20429687]
      right:
        color_sub_topic:         /prometheus/right/rotated/color/image_raw
        depth_sub_topic:        /prometheus/right/rotated/depth/image_rect
        depth_info_sub_topic:   /prometheus/right/rotated/color/camera_info
        camera_frame:          prometheus/right
        camera_to_body_rotation:  [ 0.00300166,  0.79443905, -0.60733565, -0.00100055]
      left:
        color_sub_topic:         /prometheus/left/color/image_raw
        depth_sub_topic:        /prometheus/left/depth/image_rect
        depth_info_sub_topic:   /prometheus/left/color/camera_info
        camera_frame:          prometheus/left
        camera_to_body_rotation:  [-0.794, -0.001, 0.003, 0.607]



# vlm_node parameters
vlm_node:
  ros__parameters:
    flip_img: false
    color_sub_topic:    /prometheus/front_stitched/image_raw
    hand_sub_topic:  /prometheus/hand/color/image_raw


stitcher_node:
  ros__parameters:
    camera_topics:
      - /prometheus/frontright/rotated/color/image_raw
      - /prometheus/frontleft/rotated/color/image_raw
    front_left_rotation: [-0.47292251, 0.67509865, -0.52806146, 0.20429687]
    front_right_rotation: [0.67956665, -0.47025164, 0.20790072, -0.52328754]
    front_left_intrinsics: [331.2188720703125, 0.0, 239.80752563476562, 0.0, 330.9553527832031, 318.1953125, 0.0, 0.0, 1.0]
    front_right_intrinsics:   [331.4258728027344, 0.0, 244.4047088623047, 0.0, 331.0950927734375, 317.4482116699219, 0.0, 0.0, 1.0]
    output_topic: /prometheus/front_stitched/image_raw
